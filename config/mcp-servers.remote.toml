# Registry for machines that use MCP servers hosted on the WSL host instead of running them locally.
# Render with: scripts/render-mcp-config.py codex --registry config/mcp-servers.remote.toml
# Use the WSL host's Tailscale name in the URLs or forward the ports over SSH.
# Codex reads the token from bearer_token_file via scripts/mcp-bearer-header.sh; Hermes uses bearer_token_env.
# Copy each server's HTTP token file to its bearer_token_file path on this machine.

[servers.slack_history]
type = "http"
url = "http://127.0.0.1:60010/mcp"
bearer_token_file = "{home}/.local/secrets/slack-history-mcp-http-token"
bearer_token_env = "SLACK_HISTORY_MCP_TOKEN"
codex_default_tools_approval_mode = "auto"

[servers.google_drive_rca]
type = "http"
url = "http://127.0.0.1:60011/mcp"
bearer_token_file = "{home}/.local/secrets/google-drive-rca-mcp-http-token"
bearer_token_env = "GOOGLE_DRIVE_RCA_MCP_TOKEN"
codex_default_tools_approval_mode = "prompt"
