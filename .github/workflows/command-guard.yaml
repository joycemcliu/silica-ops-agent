name: command-guard
on:
  push:
    paths: ['command-guard/**', 'scripts/command-guard-client.py', '.github/workflows/command-guard.yaml']
  pull_request:
    paths: ['command-guard/**', 'scripts/command-guard-client.py', '.github/workflows/command-guard.yaml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: command-guard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: '3.12'
      - run: docker pull python@sha256:b18b261e1b4974b4f321451ad5251ded85abb22c2b8b262da527dda1d031ab30
      - run: uv sync --locked --group dev
      - run: docker build -t command-guard-gateway:local -f deploy/docker/Gateway.Dockerfile .
      - run: uv run ruff check src tests integrations deploy/linux/*.py ../scripts/command-guard-client.py
      - run: uv run ruff format --check src tests integrations deploy/linux/*.py ../scripts/command-guard-client.py
      - run: COMMAND_GUARD_REQUIRE_DOCKER=1 uv run pytest -q -ra
