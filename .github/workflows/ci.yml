name: broker
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: broker/go.mod
          cache-dependency-path: broker/go.sum
      - run: make build
      - run: make lint
      - run: make test
